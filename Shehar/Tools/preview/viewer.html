<!doctype html>
<html><head><meta charset="utf-8"><title>City Mesh Preview</title>
<style>html,body{margin:0;background:#9fb8d0;overflow:hidden}#info{position:fixed;left:10px;top:8px;font:14px sans-serif;color:#fff;text-shadow:0 1px 2px #000}</style>
</head><body><div id="info"></div>
<script src="three.min.js"></script>
<script>
// Renders meshes exported by Tests/GeometryHarness (the game's real ChunkBuilder output) with flat colours
// approximating the in-game materials. Query: ?view=0..3
const BASE = {
  facade0:[1,1,1],facade1:[1,1,1],facade2:[0.85,0.9,0.95],facade3:[0.97,0.97,0.97],roofs:[0.62,0.6,0.57],roofprops:[0.75,0.75,0.75],temples:[1,1,1],
  asphalt:[0.31,0.31,0.32],asphaltMajor:[0.29,0.29,0.3],markings:[0.95,0.95,0.92],sidewalks:[0.62,0.58,0.53],curbs:[0.95,0.75,0.15],
  parapets:[0.7,0.69,0.66],bumps:[0.95,0.8,0.1],rail:[0.45,0.42,0.4],viaduct:[0.85,0.84,0.81],bark:[0.36,0.27,0.2],leaves:[0.3,0.48,0.22],
  lamppoles:[0.5,0.5,0.52],lampheads:[1,0.9,0.7],props:[0.9,0.9,0.9],cloth:[1,1,1],
  area_residential:[0.6,0.55,0.47],area_commercial:[0.64,0.6,0.56],area_industrial:[0.55,0.54,0.52],area_campus:[0.66,0.6,0.5],
  area_military:[0.66,0.6,0.5],area_railway:[0.55,0.54,0.52],area_cemetery:[0.47,0.58,0.3],area_construction:[0.74,0.66,0.5],
  area_parking:[0.4,0.4,0.41],area_grass:[0.47,0.58,0.3],area_pitch:[0.47,0.6,0.3],area_park:[0.36,0.55,0.26],area_forest:[0.28,0.42,0.2],
  area_sand:[0.74,0.66,0.5],area_water:[0.22,0.36,0.4]
};
const VIEWS = [
  {pos:[-260,170,260], look:[0,0,0], label:'Overview - Deccan Gymkhana / FC Road area (aerial)'},
  {pos:[60,22,120], look:[-40,0,-10], label:'Street level near Deccan Gymkhana'},
  {pos:[0,520,1], look:[0,0,0], label:'Top-down (north up)'},
  {pos:[230,60,-90], look:[60,0,40], label:'River and bridges (Mula-Mutha)'},
];
const view = VIEWS[+(new URLSearchParams(location.search).get('view')||0)];
const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true});
renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(1);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fb8d0);
scene.fog = new THREE.Fog(0x9fb8d0, 500, 1100);
const cam = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.3, 3000);
cam.position.set(...view.pos); cam.lookAt(new THREE.Vector3(...view.look));
scene.add(new THREE.HemisphereLight(0xcfe0ff, 0x6b5a45, 0.75));
const sun = new THREE.DirectionalLight(0xfff2dd, 1.1); sun.position.set(-300,400,200);
sun.castShadow = true; sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-500,right:500,top:500,bottom:-500,near:10,far:1500});
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(4000,4000), new THREE.MeshLambertMaterial({color:0x9e8c6e}));
ground.rotation.x = -Math.PI/2; ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);
fetch('out/' + (new URLSearchParams(location.search).get('file')||'pune_region.json')).then(r=>r.json()).then(d=>{
  let tris = 0;
  for (const g of d.groups) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(g.pos, 3));
    const b = BASE[g.name] || [1,0,1];
    const col = new Float32Array(g.col.length);
    for (let i=0;i<g.col.length;i+=3){ col[i]=g.col[i]/255*b[0]; col[i+1]=g.col[i+1]/255*b[1]; col[i+2]=g.col[i+2]/255*b[2]; }
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    geo.setIndex(g.idx);
    geo.computeVertexNormals();
    // FrontSide only: verifies the exported winding (back faces would disappear)
    const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.FrontSide,
      polygonOffset: g.name==='markings'||g.name==='curbs', polygonOffsetFactor:-2, polygonOffsetUnits:-2}));
    m.castShadow = !g.name.startsWith('area') && !['asphalt','asphaltMajor','markings','sidewalks','curbs'].includes(g.name);
    m.receiveShadow = true;
    scene.add(m); tris += g.idx.length/3;
  }
  document.getElementById('info').textContent = view.label + ' - ' + d.groups.length + ' material groups, ' + tris.toLocaleString() + ' triangles (generated from OSM by the game\'s ChunkBuilder)';
  renderer.render(scene, cam);
  document.title = 'ready';
});
</script></body></html>
